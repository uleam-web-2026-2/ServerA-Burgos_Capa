$kind: http-request
name: GET Clientes Sin Token
method: GET
url: '{{base_url}}/clientes'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("Código sin_token", () => {
          const json = pm.response.json();
          pm.expect(json.error.codigo).to.eql("sin_token");
      });