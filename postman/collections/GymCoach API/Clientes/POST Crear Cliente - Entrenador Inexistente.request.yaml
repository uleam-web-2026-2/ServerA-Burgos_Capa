$kind: http-request
method: POST
url: '{{base_url}}/clientes'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Test",
      "correo": "test@example.test",
      "objetivo": "Objetivo",
      "entrenador_id": 99999
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 422", () => pm.response.to.have.status(422));
      pm.test("Respuesta es JSON", () => pm.response.to.be.json);
      pm.test("Código de error es entrenador_invalido", () => {
          const json = pm.response.json();
          pm.expect(json.error.code).to.eql("entrenador_invalido");
      });
