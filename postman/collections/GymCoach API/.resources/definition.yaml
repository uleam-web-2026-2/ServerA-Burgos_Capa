$kind: collection
name: GymCoach API
description: Pruebas para la API GymCoach - gestión de clientes y rutinas de entrenadores personales
auth:
  type: bearer
  bearer:
    - key: token
      value: '{{token_entrenador}}'
      type: string
variables:
  - key: base_url
    value: 'http://localhost:8080'
  - key: rutina_id
    value: '1'
  - key: token_entrenador
    value: ''
  - key: token_cliente
    value: ''
