$kind: http-request
method: DELETE
url: '{{base_url}}/rutinas/1'
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Respuesta es JSON", () => pm.response.to.be.json);
      pm.test("Mensaje de confirmación presente", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
      });
