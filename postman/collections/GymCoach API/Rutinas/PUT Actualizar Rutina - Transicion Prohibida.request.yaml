$kind: http-request
name: 'PUT Ignora Cambio de Estado'
method: PUT
url: '{{base_url}}/rutinas/{{rutina_id}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fuerza inicial",
      "descripcion": "Cuerpo completo",
      "dias_semana": 3,
      "estado": "completada",
      "cliente_id": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
        pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Respuesta es JSON", () => pm.response.to.be.json);
        pm.test("PUT no cambia el estado a completada", () => {
          const json = pm.response.json();
          pm.expect(json.datos.estado).to.not.eql("completada");
      });
