$kind: http-request
name: PATCH Transición Válida
method: PATCH
url: '{{base_url}}/rutinas/{{rutina_id}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "estado": "en_progreso"
    }
auth:
  type: bearer
  bearer:
    - key: token
      value: '{{token_cliente}}'
      type: string
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("El cliente inicia la rutina", () => {
          const json = pm.response.json();
          pm.expect(json.datos.estado).to.eql("en_progreso");
      });