$kind: http-request
method: GET
url: '{{base_url}}/rutinas/{{rutina_id}}'
auth:
  type: bearer
  bearer:
    - key: token
      value: '{{token_cliente}}'
      type: string
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Respuesta es JSON", () => pm.response.to.be.json);
      pm.test("Rutina tiene campos requeridos", () => {
          const json = pm.response.json();
          pm.expect(json.datos).to.have.property("id");
          pm.expect(json.datos).to.have.property("titulo");
          pm.expect(json.datos).to.have.property("descripcion");
          pm.expect(json.datos).to.have.property("dias_semana");
          pm.expect(json.datos).to.have.property("estado");
          pm.expect(json.datos).to.have.property("cliente_id");
      });
      pm.test("Estado es válido", () => {
          const json = pm.response.json();
          pm.expect(["pendiente","en_progreso","completada"]).to.include(json.datos.estado);
      });
