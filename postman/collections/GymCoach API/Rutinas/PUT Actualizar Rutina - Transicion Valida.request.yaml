$kind: http-request
name: 'PUT Actualizar Rutina'
method: PUT
url: '{{base_url}}/rutinas/{{rutina_id}}'
order: 5000
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fuerza inicial",
      "descripcion": "Cuerpo completo",
      "dias_semana": 3,
      "cliente_id": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Respuesta es JSON", () => pm.response.to.be.json);
          pm.test("Rutina actualizada", () => {
          const json = pm.response.json();
            pm.expect(json.datos.titulo).to.eql("Fuerza inicial");
      });
