<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="960" height="360" fill="#f4f7fb"/>
  <text x="55" y="60" fill="#12345a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Máquina de estados · Rutina</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="75" y="145" width="220" height="78" rx="14" fill="#dceafa" stroke="#47739d" stroke-width="2"/>
    <text x="185" y="177" fill="#12345a" font-size="13">INICIAL</text>
    <text x="185" y="204" fill="#12345a" font-size="22" font-weight="700">pendiente</text>
    <rect x="370" y="145" width="220" height="78" rx="14" fill="#dceafa" stroke="#47739d" stroke-width="2"/>
    <text x="480" y="193" fill="#12345a" font-size="22" font-weight="700">en_progreso</text>
    <rect x="665" y="145" width="220" height="78" rx="14" fill="#d8f1df" stroke="#49865c" stroke-width="2"/>
    <text x="775" y="193" fill="#285f3b" font-size="22" font-weight="700">completada</text>
    <text x="332" y="135" fill="#47739d" font-size="14">cliente inicia</text>
    <text x="628" y="135" fill="#47739d" font-size="14">cliente termina ciclo</text>
  </g>
  <g fill="none" stroke="#1976d2" stroke-width="3">
    <path d="M295 184 H360" marker-end="url(#arrow)"/>
    <path d="M590 184 H655" marker-end="url(#arrow)"/>
  </g>
  <rect x="237" y="270" width="486" height="54" rx="10" fill="#fff8e1" stroke="#e5d18f"/>
  <text x="480" y="304" text-anchor="middle" fill="#765b00" font-family="Arial,sans-serif" font-size="17">No se permite pasar de pendiente directamente a completada.</text>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1976d2"/>
    </marker>
  </defs>
</svg>
