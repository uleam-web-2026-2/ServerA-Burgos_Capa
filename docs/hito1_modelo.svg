<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f4f7fb"/>
  <text x="50" y="55" fill="#12345a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Modelo de datos · GymCoach</text>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="120" width="235" height="245" rx="12" fill="#fff" stroke="#47739d" stroke-width="2"/>
