    <text x="78" y="152" fill="#fff" font-size="20" font-weight="700">Entrenador</text>
    <text x="78" y="205" fill="#24364b" font-size="17">ID: uint</text>
    <text x="78" y="240" fill="#24364b" font-size="17">Nombre: string</text>
    <text x="78" y="275" fill="#24364b" font-size="17">Correo: string</text>
    <text x="78" y="320" fill="#62758a" font-size="14">1 entrenador por cuenta</text>
    <rect x="365" y="120" width="235" height="245" rx="12" fill="#fff" stroke="#47739d" stroke-width="2"/>
    <rect x="365" y="120" width="235" height="48" rx="12" fill="#17365d"/>
    <text x="388" y="152" fill="#fff" font-size="20" font-weight="700">Cliente</text>
    <text x="388" y="205" fill="#24364b" font-size="17">ID: uint</text>
    <text x="388" y="240" fill="#24364b" font-size="17">Nombre, correo</text>
    <text x="388" y="275" fill="#24364b" font-size="17">Objetivo: string</text>
    <text x="388" y="320" fill="#62758a" font-size="14">EntrenadorID: uint</text>
    <rect x="675" y="120" width="235" height="245" rx="12" fill="#fff" stroke="#47739d" stroke-width="2"/>
    <rect x="675" y="120" width="235" height="48" rx="12" fill="#17365d"/>
    <text x="698" y="152" fill="#fff" font-size="20" font-weight="700">Rutina</text>
    <text x="698" y="205" fill="#24364b" font-size="17">ID: uint</text>
